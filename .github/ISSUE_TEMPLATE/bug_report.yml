name: "🐛 Bug Report"
description: "Create a report to help us fix a bug in rcal"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I click on the day slot...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `rcal`
        2. Press 'w' to switch to Week view
        3. Click on ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Linux (Ubuntu / Debian)
        - Linux (Arch / Fedora / Other)
        - Windows 10 / 11
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal Emulator
      description: Which terminal emulator are you using? (e.g., Alacritty, iTerm2, Kitty, WezTerm, Ghostty, Windows Terminal)
      placeholder: Ghostty / WezTerm / iTerm2
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: rcal Version
      description: Run `rcal --version` or check the header bar.
      placeholder: 0.1.0 (commit ...)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Backtrace (if applicable)
      description: Run with `RUST_BACKTRACE=1 rcal` and paste output here.
      render: shell
