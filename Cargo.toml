[package]
name = "rcal"
version = "2026.1105.1"
edition = "2021"
authors = ["jungkh"]
description = "Fast, mouse-interactive TUI Calendar in Rust with multi-cloud sync"
license = "MIT"
repository = "https://github.com/eeyees/rcal"
homepage = "https://github.com/eeyees/rcal"
readme = "README.md"
keywords = ["calendar", "tui", "ratatui", "terminal", "caldav"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
tokio = { version = "1.40.0", features = ["full"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
chrono = { version = "0.4.38", features = ["serde"] }
chrono-tz = "0.10.0"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
toml = "0.8"
anyhow = "1.0.89"
dirs = "5.0.1"


# Sync & Network dependencies
url = "2.5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
quick-xml = { version = "0.36", features = ["serialize"] }
icalendar = "0.16"

# Desktop notifications
notify-rust = "4"
sys-locale = "0.3.2"

